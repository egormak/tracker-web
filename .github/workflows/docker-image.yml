name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/egormak/tracker-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Compute image tags
        # Computed once so build and push agree even across an hour boundary (UTC).
        run: |
          NOW=$(date -u +%s)
          echo "TAG_DATE=$(date -u -d "@$NOW" +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "TAG_HOUR=$(date -u -d "@$NOW" +%Y-%m-%d-%H)" >> "$GITHUB_ENV"

      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile --tag $IMAGE_NAME:$TAG_HOUR --tag $IMAGE_NAME:$TAG_DATE --tag $IMAGE_NAME:latest

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the Docker image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:$TAG_HOUR
          docker push $IMAGE_NAME:$TAG_DATE
          docker push $IMAGE_NAME:latest
