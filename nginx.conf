server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Live timer events: a WebSocket needs HTTP/1.1 and the Upgrade headers passed on,
  # otherwise tracker-server answers 426 and the page falls back to polling.
  location = /api/v1/timer/ws {
    proxy_pass ${TRACKER_SERVER_URL};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Proxy API to tracker-server
  location /api/ {
    proxy_pass ${TRACKER_SERVER_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve static assets
  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
